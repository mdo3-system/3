<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Kindle Book Cover Preview</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 { margin-bottom: 20px; }
    .cover-container {
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
    }
    img, svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <h1>表紙完成プレビュー (Kindle 2,560 x 1,600 モック)</h1>
  <div class="cover-container">
    <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&amp;family=Noto+Sans+JP:wght@700;900&amp;display=swap');
      .title-series {
        font-family: 'Shippori Mincho', 'Yu Mincho', serif;
        font-size: 78px;
        font-weight: 800;
        fill: #FFF8E7;
        stroke: #0D1B2A;
        stroke-width: 3px;
        text-anchor: middle;
        filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.9));
      }
      .title-sub {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 42px;
        font-weight: 700;
        fill: #F4D06F;
        text-anchor: middle;
        filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.95));
      }
      .badge-bg {
        fill: #0D1B2A;
        stroke: #F4D06F;
        stroke-width: 5px;
        rx: 25px;
        ry: 25px;
        filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.7));
      }
      .badge-text {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 44px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background Base Image -->
  <image href="cover.png" x="0" y="0" width="1600" height="2560" preserveAspectRatio="xMidYMid slice" />

  <!-- Top Dark Overlay Box for Text Readability -->
  <rect x="100" y="140" width="1400" height="420" rx="30" fill="rgba(13, 27, 42, 0.75)" stroke="#F4D06F" stroke-width="4" />

  <!-- Main Titles -->
  <text x="800" y="270" class="title-series">英検ステップアップ多読</text>
  <text x="800" y="375" class="title-series" font-size="70px">：イソップ寓話編</text>

  <!-- Subtitle -->
  <text x="800" y="485" class="title-sub">4級 ➔ 3級対比学習で合格レベルの英文力を身につける！</text>

  <!-- Bottom Volume Badge -->
  <g transform="translate(800, 2340)">
    <rect x="-380" y="-60" width="760" height="120" class="badge-bg" />
    <text x="0" y="15" class="badge-text">第1巻（英検3級受検者向け）</text>
  </g>
</svg>
  </div>
</body>
</html>
