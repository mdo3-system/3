<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&amp;family=Noto+Sans+JP:wght@700;900&amp;display=swap');
      .title-series {
        font-family: 'Shippori Mincho', 'Yu Mincho', serif;
        font-size: 78px;
        font-weight: 800;
        fill: #FFF8E7;
        stroke: #0D1B2A;
        stroke-width: 3px;
        text-anchor: middle;
        filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.9));
      }
      .title-sub {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 42px;
        font-weight: 700;
        fill: #F4D06F;
        text-anchor: middle;
        filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.95));
      }
      .badge-bg {
        fill: #0D1B2A;
        stroke: #F4D06F;
        stroke-width: 5px;
        rx: 25px;
        ry: 25px;
        filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.7));
      }
      .badge-text {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 44px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background Base Image -->
  <image href="cover.png" x="0" y="0" width="1600" height="2560" preserveAspectRatio="xMidYMid slice" />

  <!-- Top Dark Overlay Box for Text Readability -->
  <rect x="100" y="140" width="1400" height="420" rx="30" fill="rgba(13, 27, 42, 0.85)" stroke="#F4D06F" stroke-width="4" />

  <!-- Main Titles -->
  <text x="800" y="270" class="title-series">英検ステップアップ多読</text>
  <text x="800" y="375" class="title-series" font-size="70px">：イソップ寓話編</text>

  <!-- Subtitle for Vol 2 -->
  <text x="800" y="485" class="title-sub">3級 ➔ 準2級対比学習で合格レベルの英文力を身につける！</text>

  <!-- Bottom Volume Badge for Vol 2 -->
  <g transform="translate(800, 2340)">
    <rect x="-420" y="-60" width="840" height="120" class="badge-bg" />
    <text x="0" y="15" class="badge-text">第2巻（英検準2級受検者向け）</text>
  </g>
</svg>